services:
  - type: web
    name: vgv-connect-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vgv-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_USERS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: MAX_PHOTO_BYTES
        value: "5242880"

  - type: web
    name: vgv-connect-web
    runtime: static
    rootDir: VGVConnect-react
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /logo-vgv.jpg
        name: Cache-Control
        value: public, max-age=86400
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        sync: false

databases:
  - name: vgv-connect-db
    plan: starter
    databaseName: vgv_connect
    user: vgv_connect
